# StuLifeEnv (long-horizon) with JAZ ablated to CodeAct+subagents

method:
  name: jaz
  prompt_path: ../prompts/long_horizon/jaz_codeact_subagents.md
  config:
    return_guard_scope: tree
    config_override:
      llm:
        model: openai/gpt-5.4-nano-2026-03-17
        reasoning_effort: high
      repl:
        allow_raise: false
        allowed_imports: ["re", "collections", "ast", "datetime", "textwrap", "pprint"]
        traceback_verbosity: repl_only
    hooks:
      # Adaptation of stulife_jaz.yaml's ContextWindowWarning hook for CodeAct+subagents.
      # The prompts (`instructions` and `guidance`) need to be copied as they are not
      # available as variables in CodeAct. The history is the `output_history` maintained
      # by the agent itself as the `__history__` variable is not available in CodeAct.
      - ContextWindowWarning:
          warn_fraction: 0.7
          warning_text: |
            Your context window is close to full. You must finish your REPL session now by delegating
            all remaining work to a subagent.

            IMPORTANT NOTES:
            - You must raise your code's timeout with a `# timeout: 86400` pragma on the FIRST line of
              your code to prevent the subagent from timing out prematurely.
            - You must give the subagent both the previous agent's REPL history (`prev_history`) if available,
              as well as your own REPL output history (`output_history`), so that existing work is not lost.

            Follow this template exactly:

            # timeout: 86400
            return invoke(
                # Give the subagent the contents of your first user prompt, <instructions> and <guidance>
                # Copy the full verbatim text as arguments to the subagent
                instructions="""...the verbatim <instructions> text in your first user prompt...""",
                guidance="""...the verbatim <guidance> text in your first user prompt...""",
                # Give the subagent both the previous agent's REPL history (the `prev_history` variable)
                # and your own REPL output history (the `output_history` variable)
                prev_history=globals().get("prev_history", []) + globals().get("output_history", []),
                # Hand over any state you've been tracking
                state=...,
                # Summarize what has been done and what remains (hard-coded string)
                prev_progress_summary="So far, ...",
                # Tell the subagent what the next steps are (hard-coded string)
                next_steps="Your next step is to ...",
            )
      - BudgetPool: {cost_budget: 50.0}
      # This hook ablates JAZ to CodeAct+subagents by removing string inputs (proxy for prompts)
      # and `__history__` from the agent's REPL. String inputs are still displayed in the prompt.
      # Prompts are updated to not mention the presence of string inputs and `__history__` as variables.
      - CodeAct: {}

env:
  name: stulife
