# AppWorld's full test_challenge split (417 tasks) with JAZ ablated to CodeAct+subagents
# performing continual self-improvement across the task queue.

method:
  name: jaz
  prompt_path: ../prompts/ttsi/jaz_codeact_subagents.md
  config:
    config_override:
      llm:
        model: openai/gpt-5.4-nano-2026-03-17
        reasoning_effort: high
      repl:
        allow_raise: false
        allowed_imports: ["re", "collections", "ast", "datetime", "textwrap", "pprint"]
        traceback_verbosity: repl_only
        allow_timeout_pragma: false
    root_config_override:
      llm:
        model: openai/gpt-5.4-2026-03-05
        reasoning_effort: high
      repl:
        exec_timeout: 14400
        allow_raise: false
        allowed_imports: ["re", "collections", "ast", "datetime", "textwrap", "pprint"]
        traceback_verbosity: repl_only
        allow_timeout_pragma: false
    hooks:
      - RecursionLimit: {max_depth: 2}
      - IterationLimit: {max_iterations: 50, min_depth: 2}
      - BudgetPool: {cost_budget: 50.0}
      # This hook ablates JAZ to CodeAct+subagents by removing string inputs (proxy for prompts)
      # and `__history__` from the agent's REPL. String inputs are still displayed in the prompt.
      # Prompts are updated to not mention the presence of string inputs and `__history__` as variables.
      - CodeAct: {}

env:
  name: appworld
  config:
    split: test_challenge
    task_seed: 42
    root: .
